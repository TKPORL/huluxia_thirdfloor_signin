name: huluxia_signin
on:
时间表:
- cron: ‘0 16 * * *’
  workflow_dispatch:
工作:
构建:
上运行:ubuntu-latest
步骤:
-名称：Checkout
用途:行动/ checkout@v3
      - name: '初始化python环境'
用途:行动/ setup-python@v4
:
python版本:3.10.11
      - name: '安装依赖'
运行:|
PIP install——升级PIP
PIP install -r ./requirements.txt
      - 名字: '开始运行'
        id: signin-outputs
        env:
NOTIFIER_TYPE: ${{secrets。NOTIFIER_TYPE}}
账户: ${{secrets。账户}}
EMAIL_CONFIG: ${{secrets。EMAIL_CONFIG}}
运行:|
python。/ main.py
