name: huluxia_signin
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: '初始化python环境'
        uses: actions/setup-python@v4
        with:
           python-version: 3.10.11
      - name: '安装依赖'
        run: |
          pip install --upgrade pip
          pip install -r ./requirements.txt
      - name: '开始运行'
        id: signin-outputs
        env:
          NOTIFIER_TYPE: ${{ secrets.NOTIFIER_TYPE }}
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          EMAIL_CONFIG: ${{ secrets.EMAIL_CONFIG }}
        run: |
          python ./main.py
      # 保活：GitHub 会在仓库连续 60 天没有提交时自动禁用定时任务，
      # 这里每天提交一个时间戳文件，保证定时任务不会被停掉。
      - name: '保活提交'
        if: always()
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > .last_run
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last_run
          git commit -m "chore: keepalive $(date -u +%Y-%m-%d)" || echo "无改动，跳过提交"
          git pull --rebase origin master || true
          git push origin HEAD:master || echo "推送失败，下次运行会重试"
